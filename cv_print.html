<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abdul Manan — Curriculum Vitae (Print Edition)</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      background-color: #ffffff;
    }
    img {
      width: 100%;
      height: auto;
      max-width: 100%;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      page-break-after: always;
      break-after: page;
    }
    img:last-child {
      page-break-after: auto;
      break-after: auto;
    }
  </style>
</head>
<body>
  <img src="Abdul_Manan_CV_Page_1.png" alt="Abdul Manan — Curriculum Vitae (Page 1)">
  <img src="Abdul_Manan_CV_Page_2.png" alt="Abdul Manan — Curriculum Vitae (Page 2)">
</body>
</html>
